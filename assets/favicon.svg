<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="130" fill="#080C14"/>
  <rect x="10" y="10" width="492" height="492" rx="120" fill="none" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="12"/>

  <!-- Gold Emblem: Ascending Double Chevrons + AI Sparkle -->
  <g filter="url(#glow)">
    <path d="M120 310 L256 174 L392 310" fill="none" stroke="url(#goldGrad)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M154 396 L256 294 L358 396" fill="none" stroke="url(#goldGrad)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <path d="M256 70 C256 115 285 130 310 130 C285 130 256 145 256 190 C256 145 227 130 202 130 C227 130 256 115 256 70 Z" fill="#FFFFFF"/>
  </g>
</svg>