<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Gold Linear Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Radial Glow Background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#080C14" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="1"/>
    </radialGradient>

    <!-- Drop Shadow for Gold Emblem -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#F59E0B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base 1080x1080 Background -->
  <rect width="1080" height="1080" fill="#080C14"/>
  <rect width="1080" height="1080" fill="url(#bgGlow)"/>

  <!-- Subtle Outer Border Accent (Safe inside square, invisible outside circle) -->
  <rect x="24" y="24" width="1032" height="1032" rx="240" fill="none" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="12"/>

  <!-- Centered Emblem (Scaled and positioned strictly within the Circular Safe Zone) -->
  <g transform="translate(540, 540) scale(1.4) translate(-256, -256)" filter="url(#goldGlow)">
    <!-- Chevrons -->
    <path d="M120 310 L256 174 L392 310" fill="none" stroke="url(#goldGrad)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M154 396 L256 294 L358 396" fill="none" stroke="url(#goldGrad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <!-- AI Sparkle / Star -->
    <path d="M256 70 C256 115 285 130 310 130 C285 130 256 145 256 190 C256 145 227 130 202 130 C227 130 256 115 256 70 Z" fill="#FFFFFF"/>
  </g>
</svg>
